# zond command-line settings
#
# Every key below is commented out, so this file as written changes nothing.
#
# This file is about how zond *shows* you a scan. What a scan puts on the wire,
# meaning retries, rates, techniques and whether DNS is used, lives next door in
# `engine.toml`.
#
# Layering, each overriding the one before:
#
#   built-in defaults  ->  /etc/zond/cli.toml  ->  this file  ->  command-line flags
#
# A layer speaks only about the keys it mentions, so a flag you did not pass
# cannot cancel a setting you did write.


# How a run is drawn.
#
#   pipe      Tab-separated records for a program: every field, no padding, no
#             heading, and a round-trip time that stays in milliseconds. The
#             only mode whose output is a stable interface.
#
#   minimal   A tagged block per host, in abbreviated tags and no colour. The
#             terse reading mode, for a narrow terminal or a long sweep.
#
#   fancy     A numbered block per host, for reading closely. Colour, aligned
#             columns, and the TLS session and certificate hanging under the
#             port that served them. The default, and the shape `scan`,
#             `discover`, `diff` and `journal` all draw in.
#
# The three differ in register rather than in how much they say: `pipe` shouts
# in field names a program matches on, `minimal` mutters in abbreviated tags,
# and `fancy` speaks in words.
#
# Records go to standard output and commentary to standard error in every mode.
#
# presentation = "fancy"


# Whether to colour the output. `--colour <WHEN>` overrides it for one run, and
# `color` is accepted here as a spelling of this same key.
#
#   auto      Colour a terminal, leave a redirected stream alone. The default.
#             Reads NO_COLOR, CLICOLOR_FORCE and TERM the way other tools do.
#
#   always    Colour whatever the stream is, which is what a pager being fed on
#             purpose needs.
#
#   never     No colour, whatever the environment says.
#
# Standard output and standard error are asked separately, so
# `zond discover lan | less` sends the records out plain and keeps the running
# commentary coloured.
#
# Colour never carries a fact by itself. Every state a colour marks is also a
# word, and the marks opening a line of commentary differ in shape as well as in
# hue, so a run captured to a file loses nothing but the paint.
#
# colour = "auto"


# The one hue in the palette you may move.
#
# `zond` draws in three greys, one accent and three states. The greys are a
# legibility decision, being what makes a label read as furniture and an address
# read as the answer. The states are what a verdict looks like: filtered is amber
# and expired is red wherever you go, because a colour that means something has
# to mean it everywhere. Neither is yours to set.
#
# The accent is the one colour here that carries no meaning at all. It marks the
# hostnames and record identifiers you scan the screen looking for, and which
# colour does that is nobody's business but yours.
#
#   teal      The default. Far enough from green, amber and red that a hostname
#             never reads as a verdict, which no warmer hue manages.
#
#   amber     An instrument-panel reading, and the closest of the three to the
#             probe programme this tool is named after. One desaturation step
#             from the colour a filtered port is drawn in, so on a display that
#             is unkind to either they can end up looking alike.
#
#   violet    Maximum separation from every state colour. A little less legible
#             at dim weights against a light background.
#
# Any colour of your own works too, written the way a colour is written
# everywhere else: `accent_colour = "#63d2c3"`. The hash is optional. The
# three-digit short form is not accepted, because here it would only be a second
# spelling of a value the long form already covers.
#
# Sent as a twenty-four bit triplet where COLORTERM says the terminal takes one,
# and rounded to the nearest of the two hundred and fifty-six otherwise, so an
# accent no palette has is still an accent.
#
# `accent_color` is accepted here as a spelling of this same key.
#
# accent_colour = "teal"


# What each detection saw, under the finding it produced.
#
# Off by default. A finding is a claim, and the line under it is the bytes the
# claim was drawn from: which four headers were absent, which version the banner
# gave back. It is what separates a finding worth acting on from one worth
# arguing with.
#
# `--evidence` turns it on for one run. It is its own key rather than part of
# `reason` below, which answers the same question about a port's verdict:
# somebody triaging findings does not want every port's packet along with them.
#
# evidence = false


# What to do about each finding, under the finding.
#
# Off by default. Where a detection carries advice this is where it goes: the
# version to upgrade to, the setting to turn off. It is addressed to somebody who
# has stopped reading the scan and started working, and most of a scan is read
# before anything is done about it.
#
# `--remedy` turns it on for one run. It is spelled that way rather than `fix`
# because on a scanner `--fix` reads as an offer to make the change; this tool
# sends probes and nothing else.
#
# remedy = false


# The packet behind every verdict, and what it carried.
#
# Off by default. A port says which packet settled it — SYN/ACK, RST, ICMP
# prohibited, no reply — with the TTL it carried and the round trip it took.
#
# This is what separates two verdicts that read alike. A port reported
# `filtered` because a firewall said so and one reported `filtered` because
# nothing came back are the same word and different findings, and only one of
# them is somebody's policy.
#
# `--reason` turns it on for one run. Not applied to `--pipe`, whose fields are
# a stable interface; a program reads the JSON, which carries all of it.
#
# reason = false


# The lowest grade of finding a listing draws.
#
# `medium` by default. A scan turns up more than most runs want to read:
# `missing HTTP security headers` is true of most web servers and says the same
# thing on each, so a sweep of forty of them is forty rows nobody reads. The
# floor keeps a listing to what could be an exposure.
#
#   info       Everything, including facts that are not weaknesses at all.
#   low        A hardening step left undone, and up.
#   medium     A real weakness with a real precondition, and up. The default.
#   high       Directly exploitable, and up.
#   critical   Remote code execution and authentication bypass alone.
#
# The count beside a host is never filtered. A host with five findings and a
# floor that draws three still says `5 risks`, and the block says how many it
# held back: a finding out of sight must not also be out of the total.
#
# `--risk` sets it for one run. Not applied to `--pipe` or the exports, which
# carry every finding whatever this says.
#
# risk = "medium"


# What makes two records, in two different scans, the same host.
#
# Read only by `zond diff`, and `--identity` overrides it for one run.
#
#   any        Two records are the same host when they share any address. The
#              default, and what follows a machine whose primary address was
#              re-picked between scans.
#   hardware   That, and when they share a hardware address. Follows a machine
#              across a DHCP lease, which is what a segment with phones on it
#              wants. Not the default because a hardware address is not always
#              the host's own: under proxy ARP a router lends its address to
#              everything behind it, and those records then fold into one.
#   primary    Only when their primary addresses match. The strictest, and the
#              right reading when the address *is* the asset, as in an external
#              scan of a public range where the machine behind it is nobody's
#              business.
#
# identity = "hardware"


# Whether to record what each scan gets through.
#
# On by default. A scan of any size can be cut short by a dropped connection, a
# closed laptop, or a ^C, and `zond scan --resume <ID>` continues one from where
# it stopped rather than starting again. `zond journal` lists what is on record.
#
# A record holds the addresses you scanned and what answered. It is kept under
# your own home, readable only by you, and `zond journal prune` clears it out:
# finished scans go after a month, unfinished ones stay until you say otherwise.
# However many you leave there, the limit below is the most that are kept.
#
# Set this to false to record nothing, or pass --no-journal for one run.
#
# journal = true


# How many records to keep at all.
#
# A hundred by default. Every scan leaves one and nothing about a scan clears
# them, so the newest hundred are what you have: each new record pushes the
# oldest one out, as it is made, without anything having to be swept.
#
# Finished records go first. An unfinished scan is the only copy of work you may
# still mean to continue, so it is the last thing a limit takes, and a scan that
# is running is never taken at all.
#
#   0       Keep none. The record of the run in flight is still written, since
#           --resume is what a journal is for; it goes when the next run starts.
#           To record nothing whatsoever, set `journal = false` above.
#
#   "unlimited"
#           Keep every record, however many there are. For an engagement where
#           the journal is evidence and you would rather bound the directory by
#           the disk than by a count.
#
# Note that 0 reads differently here than in `page_size` below, where it means no
# limit: a page of no records is not something anyone wants, and a journal of no
# records is. That is also why the word above is "unlimited" rather than "none",
# which beside a 0 that means "keep none" would be read as the same thing and is
# the opposite.
#
# `zond journal prune` applies this same number, so the most a sweep leaves
# behind and the most a scan leaves behind are one setting rather than two.
#
# journal_entry_limit = 100


# How many records `zond journal` lists at once.
#
# Ten by default, newest first, since the ones you are usually looking for are
# the recent ones. `--page 2` steps back through the rest, `-n 25` changes it
# for one run, and `--all` lists everything.
#
# Set this to 0 for no limit at all.
#
# Paging is for reading, so `--pipe` lists everything whatever this says: that
# mode's output is a stable interface, and a program should not have to know
# about pages to receive every record. Passing `-n` or `--page` still applies
# there, because then it was asked for.
#
# page_size = 10
