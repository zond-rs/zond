# Test, lint, format and build the documentation, on Linux and macOS runners.
#
# Releases live in `release.yml` beside this file, which builds the Debian
# packages a tag ships. They belong in this repository rather than in the
# engine: a library's release is `cargo publish`, and this is the one that
# produces a binary somebody downloads.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout the CLI
        uses: actions/checkout@v4
        with:
          path: zond-cli

      # The engine is a path dependency while the two repositories move
      # together, so a checkout of this one alone does not build. It follows
      # this repository's branch rather than its own default: development
      # happens on `feat/main` in both, and the engine version this crate
      # declares is often one the default branch has not reached yet.
      - name: Checkout the engine beside it
        uses: actions/checkout@v4
        with:
          repository: zond-rs/zond-engine
          path: zond-engine
          ref: ${{ (github.head_ref || github.ref_name) == 'feat/main' && 'feat/main' || 'main' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libpcap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zond-cli

      # The suite scans loopback and nothing else, so it needs no network and no
      # privileges. Anything that needed either would be a test about the runner
      # rather than about this program.
      - name: Run tests
        working-directory: zond-cli
        run: cargo test

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the CLI
        uses: actions/checkout@v4
        with:
          path: zond-cli

      - name: Checkout the engine beside it
        uses: actions/checkout@v4
        with:
          repository: zond-rs/zond-engine
          path: zond-engine
          ref: ${{ (github.head_ref || github.ref_name) == 'feat/main' && 'feat/main' || 'main' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zond-cli

      - name: Check formatting
        working-directory: zond-cli
        run: cargo fmt --check

      - name: Clippy
        working-directory: zond-cli
        run: cargo clippy --all-targets -- -D warnings

  # A binary publishes no documentation, so this is not the engine's reason for
  # the same job. The doc comments here are how the next person learns why a
  # line reads as it does, and they lean on intra-doc links to say it. A link
  # left behind by a rename reads as fine in an editor and points at nothing,
  # and no other job builds the documentation to notice. Private items too,
  # since a binary's items are all private and a public-only build checks none.
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the CLI
        uses: actions/checkout@v4
        with:
          path: zond-cli

      - name: Checkout the engine beside it
        uses: actions/checkout@v4
        with:
          repository: zond-rs/zond-engine
          path: zond-engine
          ref: ${{ (github.head_ref || github.ref_name) == 'feat/main' && 'feat/main' || 'main' }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zond-cli

      # `target/doc` comes back from the cache, and cargo takes it for current
      # and skips rustdoc, exiting 0 having checked nothing. The gate is worth
      # exactly as much as this line makes it worth.
      - name: Discard any cached documentation
        working-directory: zond-cli
        run: rm -rf target/doc

      - name: Build documentation
        working-directory: zond-cli
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --document-private-items

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the CLI
        uses: actions/checkout@v4
        with:
          path: zond-cli

      - name: Checkout the engine beside it
        uses: actions/checkout@v4
        with:
          repository: zond-rs/zond-engine
          path: zond-engine
          ref: ${{ (github.head_ref || github.ref_name) == 'feat/main' && 'feat/main' || 'main' }}

      # Pinned to the exact version `Cargo.toml` declares. Without this the
      # `rust-version` field is an assertion nobody checks, and the README badge
      # advertising it is a promise to strangers made on no evidence.
      - name: Install the declared minimum toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zond-cli

      - name: Build on the declared minimum
        working-directory: zond-cli
        run: cargo build
