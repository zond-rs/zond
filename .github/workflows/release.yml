# Builds the Debian packages a tagged release ships, and attaches them to it.
#
# `cargo install zond-cli` already serves anybody who has a Rust toolchain. This
# is for everybody else. On Kali, which is where this program has its audience,
# a tool arrives as a .deb or it does not arrive.
#
# The macOS tarballs are for the Homebrew tap (zond-rs/homebrew-tap), whose
# formula points at them by URL and checksum, and for anybody who wants the
# binary without either.
#
# The Windows installer is built by `windows/build.sh` and attached to the same
# release. It does not bundle Npcap, which may not be redistributed without a
# licence from the Nmap Project; it checks for it and points to npcap.com.
name: Release

on:
  push:
    tags: ["v*"]
  # For building a package off a branch to try before a tag exists. Nothing is
  # published in that case; the artifacts are on the run.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Debian package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Built on Debian 12 rather than on the runner's own Ubuntu, because the
    # package has to install on both sides of the 64-bit time_t transition.
    # `cargo deb` reads the dependency names off the build host: on a post-t64
    # base that is `libpcap0.8t64`, which does not exist on bookworm, Parrot or
    # Ubuntu 22.04, and apt there can only refuse the package. Bookworm still
    # calls it `libpcap0.8`, and the t64 package declares `Provides:
    # libpcap0.8`, so the older name is the one that resolves everywhere.
    #
    # It sets the glibc floor to bookworm's for the same reason: a binary built
    # against a newer one will not start on an older distribution.
    container: rust:1.93-bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kali on its own hardware, and Kali in a virtual machine on an Apple
          # Silicon host, which is arm64 and is what a good deal of this gets
          # tried on first. Both runners are native, so nothing cross-compiles
          # and `libpcap-dev` comes from the runner's own apt.
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }

    steps:
      - name: Checkout the CLI
        uses: actions/checkout@v4
        with:
          path: zond-cli

      # The engine is a path dependency while the two repositories move together
      # and a crates.io dependency at the moment one is published, and which of
      # the two is in `Cargo.toml` depends on where in that cycle the tag falls.
      # Checking it out costs a few seconds and covers the first case.
      - name: Checkout the engine beside it
        uses: actions/checkout@v4
        with:
          repository: zond-rs/zond-engine
          path: zond-engine

      # No toolchain step: the container carries the one its tag names, which
      # also pins what a release is built with. No `sudo` either, there being
      # no user here to escalate from.
      - name: Install libpcap
        run: apt-get update && apt-get install -y libpcap-dev

      - name: Install cargo-deb
        uses: taiki-e/install-action@cargo-deb

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zond-cli

      # A package whose filename disagrees with the tag it came from is worse
      # than no package, because the disagreement travels with the file.
      - name: Check the tag against the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: zond-cli
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, Cargo.toml says $crate" >&2
            exit 1
          fi
          echo "tag and crate agree on $crate"

      - name: Build the package
        working-directory: zond-cli
        run: cargo deb

      # What the package ended up claiming about itself, on the run rather than
      # only inside the file, so a dependency that resolved to an unexpected
      # name is visible without downloading anything.
      - name: Show what it declares
        working-directory: zond-cli
        run: dpkg-deb --info target/debian/*.deb

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: zond-${{ matrix.arch }}
          path: zond-cli/target/debian/*.deb
          if-no-files-found: error

  macos:
    name: macOS tarball (${{ matrix.target }})
    # Both architectures on the one Apple Silicon runner. The macOS SDK carries
    # libpcap for arm64 and x86_64 alike, so the Intel build is an ordinary
    # cross-compile with nothing to install, and it does not wait on a runner
    # image that is being retired.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - name: Checkout the CLI
        uses: actions/checkout@v4
        with:
          path: zond-cli

      - name: Checkout the engine beside it
        uses: actions/checkout@v4
        with:
          repository: zond-rs/zond-engine
          path: zond-engine

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zond-cli
          key: ${{ matrix.target }}

      - name: Check the tag against the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: zond-cli
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, Cargo.toml says $crate" >&2
            exit 1
          fi

      - name: Build
        working-directory: zond-cli
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The binary, the licence and the README in one directory named for
      # what it is, and a checksum beside it for the formula to pin.
      - name: Package
        working-directory: zond-cli
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          name="zond-$version-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/zond" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          file "dist/$name/zond"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: zond-${{ matrix.target }}
          path: |
            zond-cli/dist/*.tar.gz
            zond-cli/dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Attach the packages to the release
    needs: [package, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Collect the packages and tarballs
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" packages/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" packages/* \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
