name: Wrong result
description: A vulnerability, service, version or OS that zond got wrong or missed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Reports like this are how the matching gets better.
        Scan output can include addresses you'd rather not post. `--redact` hides them.
  - type: textarea
    id: reported
    attributes:
      label: What zond reported
      description: The lines that are wrong. `--risks --explain` shows the reasoning behind a finding.
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What's actually there
      description: |
        And how you know. For a package, `dpkg -l <package>` or `rpm -q <package>`
        on the target helps a lot. For a false vulnerability, a link to the advisory saying it's fixed.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and version
      description: The command you ran and the output of `zond --version`.
      render: text
    validations:
      required: true
