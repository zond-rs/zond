name: Bug report
description: Zond crashed, printed an error or did something it shouldn't.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        If a finding, service or OS looks wrong, please use "Wrong result" instead.
        Scan output can include addresses you'd rather not post. `--redact` hides them.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what you expected instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The exact command you ran and what it printed. Adding `-vv` helps.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and OS
      placeholder: zond 0.19.0 on Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed from
      options:
        - .deb package
        - .rpm package
        - Homebrew
        - Nix
        - Windows installer
        - cargo install
        - Built from source
    validations:
      required: true
