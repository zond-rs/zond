name: Feature request
description: Something zond doesn't do yet.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation matters more than the solution. There's often more than one way to get there.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: A flag, an output format, a protocol. Examples from other tools are welcome.
